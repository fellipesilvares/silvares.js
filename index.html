<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>silvares.js</title>
  <meta name="description" content="Fellipe Silvares (semfomee) — Dev &amp; Criador de sites. Twitch, Instagram e TikTok em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="semfomee — Fellipe Silvares">
  <meta property="og:description" content="Dev & Criador de sites. Twitch, Instagram e TikTok em um só lugar.">
  <meta property="og:site_name" content="semfomee">
  <meta property="og:url" content="https://fellipesilvares.github.io/silvares.js/">
  <meta property="og:image" content="https://fellipesilvares.github.io/silvares.js/fundosite.webp">

  <meta name="twitter:image" content="https://fellipesilvares.github.io/silvares.js/fundosite.webp">

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png">
  <link rel="shortcut icon" href="./favicon_io/favicon.ico">
  <link rel="manifest" href="./favicon_io/site.webmanifest">
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --card: rgba(30,20,55,.50);
      --card-hover: rgba(45,30,80,.68);
      --text: #f5f5f7;
      --muted: #c3bfe0;
      --line: rgba(255,255,255,.12);
      --accent: #a78bfa;
      --accent-soft: rgba(167,139,250,.20);
      --radius: 22px;
      --bg-image: url("./fundosite.webp");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      background: #0a0618;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -3%;
      z-index: -3;
      background:
        linear-gradient(rgba(10, 5, 25, .04), rgba(10, 5, 25, .14)),
        var(--bg-image) center center / cover no-repeat;
      transform: translate3d(var(--mx, 0px), var(--my, 0px), 0) scale(1.04);
      transform-origin: center;
      animation: landscapeDrift 22s ease-in-out infinite alternate;
      will-change: transform;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 35%, transparent 30%, rgba(10, 5, 30, .12) 100%),
        linear-gradient(to bottom, rgba(15, 8, 35, .02), rgba(8, 4, 20, .22));
    }

    #particles { position: fixed; inset: 0; z-index: -1; opacity: .28; }

    @keyframes landscapeDrift {
      0% { transform: translate3d(var(--mx, 0px), var(--my, 0px), 0) scale(1.02) rotate(0deg); }
      50% { transform: translate3d(calc(var(--mx, 0px) - 8px), calc(var(--my, 0px) + 5px), 0) scale(1.06) rotate(.1deg); }
      100% { transform: translate3d(calc(var(--mx, 0px) + 9px), calc(var(--my, 0px) - 6px), 0) scale(1.02) rotate(-.1deg); }
    }

    .wrap { width: min(620px, calc(100% - 28px)); margin: 0 auto; padding: 60px 0 40px; }
    .profile { text-align: center; }

    .avatar-wrap { position: relative; width: 116px; height: 116px; margin: 0 auto 18px; }
    .avatar {
      width: 116px; height: 116px;
      border-radius: 50%; display: grid; place-items: center;
      font-size: 38px; font-weight: 800;
      background: #0c0c10;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 8px var(--accent-soft), 0 18px 55px rgba(0,0,0,.55);
      transition: box-shadow .3s ease;
    }
    .avatar:hover { box-shadow: 0 0 0 10px var(--accent-soft), 0 22px 60px rgba(0,0,0,.6); }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .verified {
      position: absolute; right: -2px; bottom: -2px;
      display: inline-flex; width: 24px; height: 24px;
      border-radius: 50%; align-items: center; justify-content: center;
      font-size: 13px; background: #fff; color: var(--accent); border: 2px solid #0a0618;
    }

    h1 { font-size: 32px; letter-spacing: -.8px; font-weight: 800; margin-bottom: 20px; }

    .stats-bar {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      backdrop-filter: blur(16px); padding: 16px 10px; margin-bottom: 22px;
    }
    .stat { text-align: center; padding: 0 6px; }
    .stat strong { display: block; font-size: 18px; font-weight: 800; color: var(--accent); }
    .stat span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .stat-divider { width: 1px; height: 30px; background: var(--line); }

    .links { display: grid; gap: 12px; }
    .link {
      position: relative; display: flex; align-items: center; gap: 14px;
      width: 100%; min-height: 66px; padding: 13px 18px;
      color: var(--text); text-decoration: none;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); backdrop-filter: blur(16px);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .link:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .icon {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center; flex: 0 0 42px;
      font-size: 19px; color: #fff;
    }
    .icon-twitch { background: #9146FF; }
    .icon-instagram { background: radial-gradient(circle at 30% 110%, #ffdb73, #fa7e1e 30%, #d62976 55%, #962fbf 75%, #4f5bd5 100%); }
    .icon-tiktok { background: #000; }
    .link-text { text-align: left; flex: 1; }
    .link-title { font-weight: 700; font-size: 14.5px; }
    .link-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .arrow {
      width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px;
      display: grid; place-items: center; color: var(--muted); font-size: 15px;
      border: 1px solid var(--line); transition: transform .2s ease, color .2s ease, border-color .2s ease;
    }
    .link:hover .arrow { color: var(--accent); border-color: var(--accent); transform: translate(2px,-2px); }

    .discord-card {
      padding: 14px 18px; display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      backdrop-filter: blur(16px);
    }
    .discord-avatar-wrap { position: relative; width: 52px; height: 52px; flex: 0 0 52px; }
    .discord-avatar {
      width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
      background: #1c1530; display: block;
    }
    .discord-status-dot {
      position: absolute; right: -2px; bottom: -2px; width: 15px; height: 15px;
      border-radius: 50%; border: 3px solid #14102a; background: #747f8d;
    }
    .discord-status-dot.online { background: #23a55a; }
    .discord-status-dot.idle { background: #f0b232; }
    .discord-status-dot.dnd { background: #f23f42; }
    .discord-status-dot.offline { background: #747f8d; }
    .discord-info { flex: 1 1 160px; min-width: 0; text-align: left; }
    .discord-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .discord-status-text { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .discord-icon { color: #5865F2; flex: 0 0 auto; display: grid; place-items: center; }

    footer { text-align: center; color: var(--muted); font-size: 11.5px; padding-top: 30px; }
    footer .heart { color: var(--accent); }

    @media (max-width: 520px) {
      .wrap { padding-top: 44px; }
      h1 { font-size: 27px; }
      .stats-bar { gap: 10px; padding: 14px 6px; }
    }

    #gate {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background:
        linear-gradient(rgba(10,6,24,.45), rgba(10,6,24,.65)),
        var(--bg-image) center center / cover no-repeat;
      cursor: pointer;
      transition: opacity .5s ease;
    }
    #gate .gate-inner { text-align: center; }
    #gate .gate-text {
      font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
      font-weight: 700; color: var(--text);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 16px 34px; background: var(--card); backdrop-filter: blur(16px);
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    #gate:hover .gate-text { border-color: var(--accent); background: var(--card-hover); transform: translateY(-2px); }
    #gate .gate-sub { margin-top: 10px; font-size: 12px; color: var(--muted); }
    #gate.hidden { opacity: 0; pointer-events: none; }
    body.locked { overflow: hidden; }
  </style>
</head>
<body class="locked">
  <div id="gate">
    <div class="gate-inner">
      <div class="gate-text">click here</div>
      <div class="gate-sub">toque para entrar</div>
    </div>
  </div>

  <canvas id="particles"></canvas>

  <main class="wrap">
    <section class="profile">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar">SF</div>
        <div class="discord-status-dot offline" id="discordStatusDot"></div>
      </div>
      <h1 id="profileName">semfomee</h1>

      <div class="stats-bar">
        <div class="stat"><strong id="visits">…</strong><span>visitas</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><strong>2026</strong><span>desde</span></div>
        <div class="stat-divider"></div>
        <div class="stat"><strong>3</strong><span>redes sociais</span></div>
      </div>
    </section>

    <section class="links">
      <a class="link" href="https://www.twitch.tv/semfomee" target="_blank" rel="noopener noreferrer">
        <div class="icon icon-twitch"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M4.3 2 3 5.7v14.6h5v2h2.8l2-2H17l4-4V2H4.3zm14.7 11.3-2.7 2.7h-4l-2 2v-2H6.7V3.7h12.3v9.6z"/><path d="M15.7 6.7h1.7v5h-1.7zm-4.6 0h1.7v5h-1.7z"/></svg></div>
        <div class="link-text"><div class="link-title">Twitch</div><div class="link-sub">@semfomee</div></div>
        <div class="arrow">↗</div>
      </a>

      <a class="link" href="https://www.instagram.com/fellipe.silvares/" target="_blank" rel="noopener noreferrer">
        <div class="icon icon-instagram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></div>
        <div class="link-text"><div class="link-title">Instagram</div><div class="link-sub">@fellipe.silvares</div></div>
        <div class="arrow">↗</div>
      </a>

      <a class="link" href="https://www.tiktok.com/@semfomee?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer">
        <div class="icon icon-tiktok"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M16.6 5.8c-.9-.6-1.5-1.6-1.6-2.8h-3v13.1c0 1.4-1.1 2.5-2.5 2.5S7 17.5 7 16.1c0-1.4 1.1-2.5 2.5-2.5.3 0 .6.1.9.2v-3.1c-.3-.1-.6-.1-.9-.1-2.9 0-5.4 2.4-5.4 5.4S6.6 21.4 9.5 21.4s5.4-2.4 5.4-5.4V9.4c1.1.8 2.5 1.3 4 1.3V7.7c-.9 0-1.8-.3-2.3-1.9z"/></svg></div>
        <div class="link-text"><div class="link-title">TikTok</div><div class="link-sub">@semfomee</div></div>
        <div class="arrow">↗</div>
      </a>
    </section>

    <audio id="audio" src="artista-generico.mp3" loop style="display:none"></audio>

    <footer>Fellipe Silvares • 2026 &nbsp;·&nbsp; feito com esforço e muito código</footer>
  </main>

  <script data-goatcounter="https://silvaresjs.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script>
    // Contador de visitas real, via GoatCounter (conta todos os visitantes, não só o navegador local)
    fetch("https://silvaresjs.goatcounter.com/counter/" + encodeURIComponent(location.pathname) + ".json")
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("visits").textContent = data.count;
      })
      .catch(() => {
        document.getElementById("visits").textContent = "—";
      });

    // Discord (Lanyard API)
    const DISCORD_ID = "1079886343850696744";
    const avatarEl = document.getElementById("avatar");
    const profileNameEl = document.getElementById("profileName");
    const discordStatusDot = document.getElementById("discordStatusDot");

    function updateDiscordCard(data) {
      const user = data.discord_user;
      const status = data.discord_status || "offline";
      const avatarExt = user.avatar && user.avatar.startsWith("a_") ? "gif" : "png";
      const avatarUrl = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${avatarExt}?size=128`
        : `https://cdn.discordapp.com/embed/avatars/0.png`;

      avatarEl.innerHTML = `<img src="${avatarUrl}" alt="Avatar de ${user.global_name || user.username}">`;
      profileNameEl.textContent = user.global_name || user.username;
      discordStatusDot.className = "discord-status-dot " + status;
    }

    async function fetchDiscordPresence() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await res.json();
        if (json.success) updateDiscordCard(json.data);
      } catch {
        // Falha na API: mantém o avatar/nome padrão que já está no HTML.
      }
    }

    fetchDiscordPresence();
    setInterval(fetchDiscordPresence, 60000);

    // Tela "click here": libera a página e inicia a música em segundo plano
    const gate = document.getElementById("gate");
    const audio = document.getElementById("audio");
    let entered = false;
    function enterSite() {
      if (entered) return;
      entered = true;
      gate.classList.add("hidden");
      document.body.classList.remove("locked");
      audio.play().catch(() => {
        // Autoplay pode ser bloqueado pelo navegador; sem player visível,
        // a música simplesmente não inicia nesse caso.
      });
      setTimeout(() => gate.remove(), 600);
    }
    gate.addEventListener("click", enterSite);
    gate.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); enterSite(); }
    });
    gate.setAttribute("tabindex", "0");
    gate.setAttribute("role", "button");
    gate.setAttribute("aria-label", "Clique para entrar no site e iniciar a música");

    // Parallax suave
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
    function updateParallax(x, y) {
      targetX = (x / innerWidth - 0.5) * 18;
      targetY = (y / innerHeight - 0.5) * 12;
    }
    addEventListener("pointermove", (event) => { updateParallax(event.clientX, event.clientY); }, { passive: true });
    addEventListener("touchmove", (event) => {
      const touch = event.touches[0];
      if (touch) updateParallax(touch.clientX, touch.clientY);
    }, { passive: true });
    function animateParallax() {
      currentX += (targetX - currentX) * 0.035;
      currentY += (targetY - currentY) * 0.035;
      document.body.style.setProperty("--mx", `${currentX}px`);
      document.body.style.setProperty("--my", `${currentY}px`);
      requestAnimationFrame(animateParallax);
    }
    animateParallax();

    // Partículas
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    function make() {
      particles = Array.from({length: 55}, () => ({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*1.5+.3, vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.18
      }));
    }
    function animate() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "rgba(255,255,255,.65)";
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    addEventListener("resize", () => { resize(); make(); });
    resize(); make(); animate();
  </script>
</body>
</html>
